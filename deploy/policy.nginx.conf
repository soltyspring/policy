# 기존 bluecl.cloud HTTPS server 블록 안에 include 해요.
# 지금은 알림을 꺼 둬서 GET만 열어요. 알림을 켜면 POST·PUT·DELETE를 더하고
# Cloudflare 규칙 "BlueCL - restrict methods and private paths"에도 /policy/api/ 예외를 넣어야 해요.
location ^~ /policy/api/ {
    proxy_pass http://127.0.0.1:18826/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 8k;
    limit_except GET OPTIONS { deny all; }
}
